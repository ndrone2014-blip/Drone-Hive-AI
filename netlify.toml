# Drone Hive AI — Netlify configuration
# No build step and no paid add-ons: Netlify serves /public as-is and runs
# the /api endpoints as Edge Functions (included on the free plan).

[build]
  publish = "public"
  edge_functions = "netlify/edge-functions"

# AI_PROVIDER only holds a provider name (e.g. "ollama") that also appears in
# the code, so Netlify's secret scanner must not treat it as a leaked secret.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "AI_PROVIDER"

[dev]
  publish = "public"
  port = 8888

# Security headers for the app pages.
# (The /api endpoints set their own headers in server/security.js, because
# Netlify doesn't apply these to Edge Functions.)
#  - Content-Security-Policy: the browser only runs scripts from this site and
#    only talks to this site, so injected code can't run or send data elsewhere.
#    Exceptions are only Google/Firebase sign-in: the Firebase SDK (gstatic.com),
#    Google's sign-in servers, and the Firebase sign-in popup/iframe.
#  - Strict-Transport-Security: always HTTPS.
#  - Cross-Origin-Opener-Policy "same-origin-allow-popups" so the
#    "Sign in with Google" popup can report back to this page.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://apis.google.com https://www.googleapis.com; frame-src https://*.firebaseapp.com https://*.web.app https://accounts.google.com; manifest-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The service worker must always be re-checked so updates roll out right away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# Never expose private files if someone adds them to /public by mistake.
[[redirects]]
  from = "/.env*"
  to = "/404"
  status = 404
  force = true

# Single-page app: unknown paths load the app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
